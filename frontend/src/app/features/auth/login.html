<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div
        class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-xl shadow-gray-200/50 transition-all hover:shadow-2xl hover:shadow-gray-300/50">
        <div class="text-center">
            <div
                class="mx-auto h-12 w-12 bg-app-primary rounded-xl flex items-center justify-center shadow-lg shadow-indigo-500/30">
                <span class="text-white font-bold text-2xl">L</span>
            </div>
            <h2 class="mt-6 text-3xl font-extrabold text-gray-900 tracking-tight">Welcome back</h2>
            <p class="mt-2 text-sm text-gray-600">
                Please sign in to your account
            </p>
        </div>

        <form class="mt-8 space-y-6" (submit)="onSubmit()">
            <div class="rounded-md shadow-sm space-y-4">
                <div>
                    <label for="username" class="block text-sm font-semibold text-gray-700 mb-1">Username</label>
                    <input id="username" name="username" type="text" [(ngModel)]="username" required
                        class="appearance-none relative block w-full px-4 py-3 border border-gray-300 placeholder-gray-400 text-gray-900 rounded-xl focus:outline-none focus:ring-2 focus:ring-app-primary focus:border-transparent transition-all sm:text-sm"
                        placeholder="Enter your username">
                </div>
                <div>
                    <label for="password" class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                    <input id="password" name="password" type="password" [(ngModel)]="password" required
                        class="appearance-none relative block w-full px-4 py-3 border border-gray-300 placeholder-gray-400 text-gray-900 rounded-xl focus:outline-none focus:ring-2 focus:ring-app-primary focus:border-transparent transition-all sm:text-sm"
                        placeholder="••••••••">
                </div>
            </div>

            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox"
                        class="h-4 w-4 text-app-primary focus:ring-app-primary border-gray-300 rounded transition-colors">
                    <label for="remember-me" class="ml-2 block text-sm text-gray-600">Remember me</label>
                </div>
                <div class="text-sm">
                    <a routerLink="/auth/forgot-password"
                        class="font-medium text-app-primary hover:text-app-secondary transition-colors">Forgot
                        password?</a>
                </div>
            </div>

            <div>
                <button type="submit"
                    class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-bold rounded-xl text-white bg-app-primary hover:bg-app-secondary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-app-primary transition-all duration-300 shadow-lg shadow-indigo-500/20 active:scale-[0.98]">
                    Sign in
                </button>
            </div>

            <!-- Divider -->
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-300"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-2 bg-white text-gray-500">Or continue with</span>
                </div>
            </div>

            <!-- Google Login Button -->
            <div>
                <button type="button" (click)="onGoogleLogin()"
                    class="w-full flex items-center justify-center gap-3 py-3 px-4 border border-gray-300 rounded-xl text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-app-primary transition-all duration-300 shadow-sm active:scale-[0.98]">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                    </svg>
                    <span class="font-medium">Sign in with Google</span>
                </button>
            </div>

            <div class="text-center mt-4">
                <p class="text-sm text-gray-600 italic">
                    Default admin: <span class="font-bold">admin / admin</span>
                </p>
            </div>
        </form>
    </div>
</div>
