<div class="min-h-screen bg-[#0F172A] flex items-center justify-center p-4">
    <div class="max-w-md w-full">
        <!-- Header -->
        <div class="text-center mb-8">
            <div
                class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-gradient-to-tr from-indigo-500 to-purple-500 shadow-lg shadow-indigo-500/20 mb-6 group transition-transform hover:scale-105 duration-300">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253">
                    </path>
                </svg>
            </div>
            <h2 class="text-3xl font-bold text-white tracking-tight">Create an account</h2>
            <p class="text-slate-400 mt-2">Join our library community today</p>
        </div>

        <!-- Register Form -->
        <div class="bg-slate-800/50 backdrop-blur-xl rounded-[2rem] p-8 border border-slate-700/50 shadow-2xl">
            <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="space-y-4">
                <!-- Success/Error Messages -->
                <div *ngIf="errorMessage"
                    class="p-4 bg-red-500/10 border border-red-500/20 rounded-2xl text-red-400 text-sm animate-shake">
                    {{ errorMessage }}
                </div>

                <div class="space-y-4">
                    <!-- Username -->
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1.5 ml-1">Username</label>
                        <input type="text" [(ngModel)]="user.username" name="username" required
                            class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-2xl text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all placeholder:text-slate-600"
                            placeholder="johndoe">
                    </div>

                    <!-- Email -->
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1.5 ml-1">Email address</label>
                        <input type="email" [(ngModel)]="user.email" name="email" required
                            class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-2xl text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all placeholder:text-slate-600"
                            placeholder="john@example.com">
                    </div>

                    <!-- Full Name -->
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1.5 ml-1">Full Name</label>
                        <input type="text" [(ngModel)]="user.fullName" name="fullName" required
                            class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-2xl text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all placeholder:text-slate-600"
                            placeholder="John Doe">
                    </div>

                    <!-- Phone Number -->
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1.5 ml-1">Phone Number</label>
                        <input type="text" [(ngModel)]="user.phoneNumber" name="phoneNumber"
                            class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-2xl text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all placeholder:text-slate-600"
                            placeholder="+1234567890">
                    </div>

                    <!-- Address -->
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1.5 ml-1">Address</label>
                        <textarea [(ngModel)]="user.address" name="address" rows="2"
                            class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-2xl text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all placeholder:text-slate-600 resize-none"
                            placeholder="123 Street, City"></textarea>
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="block text-sm font-medium text-slate-400 mb-1.5 ml-1">Password</label>
                        <input type="password" [(ngModel)]="user.password" name="password" required
                            class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-2xl text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all placeholder:text-slate-600"
                            placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" [disabled]="!registerForm.form.valid || isLoading"
                    class="w-full py-4 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold rounded-2xl hover:from-indigo-500 hover:to-purple-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-slate-800 transition-all shadow-lg shadow-indigo-600/20 disabled:opacity-50 disabled:cursor-not-allowed transform active:scale-[0.98]">
                    <span *ngIf="!isLoading">Register Now</span>
                    <span *ngIf="isLoading" class="flex items-center justify-center">
                        <svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                    </span>
                </button>

                <p class="text-center text-slate-400 text-sm mt-6">
                    Already have an account?
                    <a routerLink="/auth/login"
                        class="text-indigo-400 font-semibold hover:text-indigo-300 transition-colors">Sign in</a>
                </p>
            </form>
        </div>
    </div>
</div>
