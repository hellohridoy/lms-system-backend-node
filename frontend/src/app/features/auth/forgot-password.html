<div
    class="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Logo/Header -->
        <div class="text-center mb-8">
            <div
                class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-purple-500 to-pink-500 rounded-2xl mb-4 shadow-lg shadow-purple-500/50">
                <span class="text-3xl font-bold text-white">L</span>
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">Forgot Password?</h1>
            <p class="text-purple-200">Enter your email to receive a reset link</p>
        </div>

        <!-- Forgot Password Form -->
        <div class="bg-white/10 backdrop-blur-lg rounded-2xl border border-white/20 p-8 shadow-2xl">
            @if (successMessage) {
            <div class="mb-6 p-4 bg-green-500/20 border border-green-500/50 rounded-lg text-green-200">
                {{ successMessage }}
            </div>
            }

            @if (errorMessage) {
            <div class="mb-6 p-4 bg-red-500/20 border border-red-500/50 rounded-lg text-red-200">
                {{ errorMessage }}
            </div>
            }

            <form (ngSubmit)="onSubmit()" #forgotForm="ngForm">
                <div class="mb-6">
                    <label class="block text-sm font-medium text-purple-200 mb-2">Email Address</label>
                    <input type="email" name="email" [(ngModel)]="email" required email
                        class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all"
                        placeholder="your@email.com" />
                </div>

                <button type="submit" [disabled]="!forgotForm.valid || loading"
                    class="w-full py-3 px-4 bg-gradient-to-r from-purple-500 to-pink-500 text-white font-semibold rounded-lg shadow-lg shadow-purple-500/50 hover:shadow-purple-500/75 transform hover:scale-[1.02] transition-all disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none">
                    @if (loading) {
                    <span class="flex items-center justify-center gap-2">
                        <svg class="animate-spin h-5 w-5" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                        Sending...
                    </span>
                    } @else {
                    Send Reset Link
                    }
                </button>
            </form>

            <div class="mt-6 text-center">
                <a routerLink="/auth/login" class="text-purple-300 hover:text-purple-100 transition-colors">
                    ← Back to Login
                </a>
            </div>
        </div>
    </div>
</div>
