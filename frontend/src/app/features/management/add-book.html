<div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div
        class="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden animate-in fade-in zoom-in duration-300">
        <div class="p-6 border-b border-gray-100 flex items-center justify-between bg-gray-50/50">
            <h2 class="text-2xl font-bold text-gray-900">Add New Book</h2>
            <button (click)="close.emit()" class="text-gray-400 hover:text-gray-600 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <form (ngSubmit)="onSubmit()" #bookForm="ngForm" class="p-8 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="text-sm font-bold text-gray-700 uppercase tracking-wider">Book Title</label>
                    <input type="text" [(ngModel)]="book.title" name="title" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-app-primary focus:border-transparent transition-all outline-none"
                        placeholder="e.g. Clean Code">
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-bold text-gray-700 uppercase tracking-wider">Author</label>
                    <input type="text" [(ngModel)]="book.author" name="author" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-app-primary focus:border-transparent transition-all outline-none"
                        placeholder="e.g. Robert C. Martin">
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-bold text-gray-700 uppercase tracking-wider">ISBN</label>
                    <input type="text" [(ngModel)]="book.isbn" name="isbn" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-app-primary focus:border-transparent transition-all outline-none"
                        placeholder="ISBN-13">
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-bold text-gray-700 uppercase tracking-wider">Genre / Category</label>
                    <select [(ngModel)]="book.genre" name="genre" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-app-primary focus:border-transparent transition-all outline-none bg-white">
                        <option value="" disabled>Select Category</option>
                        <option *ngFor="let genre of genres" [value]="genre">{{ genre }}</option>
                    </select>
                </div>

                <div *ngIf="book.genre === 'Other'" class="space-y-2">
                    <label class="text-sm font-bold text-gray-700 uppercase tracking-wider">Custom Category</label>
                    <input type="text" [(ngModel)]="customGenre" name="customGenre" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-app-primary focus:border-transparent transition-all outline-none"
                        placeholder="e.g. Docker">
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-bold text-gray-700 uppercase tracking-wider">Total Copies</label>
                    <input type="number" [(ngModel)]="book.totalCopies" name="totalCopies" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-app-primary focus:border-transparent transition-all outline-none"
                        min="1">
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-bold text-gray-700 uppercase tracking-wider">Cover Image URL</label>
                    <input type="text" [(ngModel)]="book.coverUrl" name="coverUrl"
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-app-primary focus:border-transparent transition-all outline-none"
                        placeholder="https://...">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-sm font-bold text-gray-700 uppercase tracking-wider">Synopsis</label>
                <textarea [(ngModel)]="book.synopsis" name="synopsis" rows="3"
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-app-primary focus:border-transparent transition-all outline-none resize-none"
                    placeholder="Brief description..."></textarea>
            </div>

            <div class="flex gap-4 pt-4">
                <button type="button" (click)="close.emit()"
                    class="flex-1 px-6 py-3 border border-gray-200 rounded-xl font-bold text-gray-600 hover:bg-gray-50 transition-all">Cancel</button>
                <button type="submit" [disabled]="!bookForm.form.valid"
                    class="flex-1 px-6 py-3 bg-app-primary text-white rounded-xl font-bold shadow-lg shadow-indigo-500/20 hover:bg-app-secondary disabled:opacity-50 transition-all active:scale-95">
                    Add Book
                </button>
            </div>
        </form>
    </div>
</div>
