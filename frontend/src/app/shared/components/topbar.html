<header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 shadow-sm">
    <div class="flex items-center gap-4">
        <h2 class="text-sm font-medium text-gray-500 uppercase tracking-widest">Library Management System</h2>
    </div>

    <div class="flex items-center gap-6">
        <button class="relative p-2 text-gray-400 hover:text-app-primary transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 01-6 0v-1m6 0H9">
                </path>
            </svg>
            <span class="absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full border-2 border-white"></span>
        </button>

        <div class="flex items-center gap-3 border-l pl-6 border-gray-100">
            <div class="text-right">
                <p class="text-sm font-bold text-gray-900">{{ userName }}</p>
                <p class="text-xs font-medium text-gray-500">{{ userRoleDisplay }}</p>
            </div>
            <div
                class="w-10 h-10 bg-app-light rounded-full flex items-center justify-center border border-gray-200 text-app-primary font-bold">
                {{ userName.charAt(0) }}
            </div>
        </div>
    </div>
</header>
