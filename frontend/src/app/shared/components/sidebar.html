<div class="w-64 bg-app-dark text-white flex flex-col h-full shadow-xl transition-all duration-300">
  <div class="p-6 flex items-center gap-3">
    <div class="w-10 h-10 bg-app-primary rounded-lg flex items-center justify-center shadow-lg shadow-indigo-500/30">
      <span class="font-bold text-xl">L</span>
    </div>
    <span class="text-xl font-bold tracking-tight">LibraryMS</span>
  </div>

  <nav class="flex-1 mt-6 px-4 space-y-1">
    <a routerLink="/dashboard" routerLinkActive="bg-white/10 text-white"
      class="flex items-center gap-3 p-3 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition-colors group">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
        </path>
      </svg>
      <span class="font-medium">Dashboard</span>
    </a>

    <a routerLink="/catalog" routerLinkActive="bg-white/10 text-white"
      class="flex items-center gap-3 p-3 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition-colors group">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253">
        </path>
      </svg>
      <span class="font-medium">Book Catalog</span>
    </a>

    <div *ngIf="userRole === 'ROLE_ADMIN' || userRole === 'ROLE_LIBRARIAN'" class="pt-4 pb-2">
      <span class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Management</span>
    </div>

    <a *ngIf="userRole === 'ROLE_ADMIN' || userRole === 'ROLE_LIBRARIAN'" routerLink="/management/requests"
      routerLinkActive="bg-white/10 text-white"
      class="flex items-center gap-3 p-3 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition-colors group">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      <span class="font-medium">Borrow Requests</span>
    </a>

    <a *ngIf="userRole === 'ROLE_ADMIN'" routerLink="/management/users" routerLinkActive="bg-white/10 text-white"
      class="flex items-center gap-3 p-3 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition-colors group">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z">
        </path>
      </svg>
      <span class="font-medium">User Management</span>
    </a>

    <div class="pt-4 pb-2">
      <div class="flex items-center justify-between px-3">
        <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Categories</span>
        <button *ngIf="authService.isAdmin()" class="text-gray-500 hover:text-white transition-colors"
          title="Add Category">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Nested Backend Menu -->
    <div class="space-y-1">
      <button (click)="isBackendExpanded = !isBackendExpanded"
        class="w-full flex items-center justify-between p-3 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition-colors group">
        <div class="flex items-center gap-3">
          <svg class="w-5 h-5 transition-colors group-hover:text-app-primary" fill="none" stroke="currentColor"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
          </svg>
          <span class="font-medium">Backend</span>
        </div>
        <svg class="w-4 h-4 transition-transform duration-200" [class.rotate-180]="isBackendExpanded" fill="none"
          stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
      </button>

      <div *ngIf="isBackendExpanded" class="pl-11 space-y-1 overflow-hidden transition-all duration-300">
        <a *ngFor="let item of backendMenus" [routerLink]="['/catalog']" [queryParams]="{genre: item.name}"
          class="block p-2 text-sm text-gray-400 hover:text-white hover:translate-x-1 transition-all">
          <span class="mr-2">{{ item.icon }}</span> {{ item.name }}
        </a>
      </div>
    </div>

    <!-- Nested Frontend Menu -->
    <div class="space-y-1">
      <button (click)="isFrontendExpanded = !isFrontendExpanded"
        class="w-full flex items-center justify-between p-3 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition-colors group">
        <div class="flex items-center gap-3">
          <svg class="w-5 h-5 transition-colors group-hover:text-app-primary" fill="none" stroke="currentColor"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4">
            </path>
          </svg>
          <span class="font-medium">Frontend</span>
        </div>
        <svg class="w-4 h-4 transition-transform duration-200" [class.rotate-180]="isFrontendExpanded" fill="none"
          stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
      </button>

      <div *ngIf="isFrontendExpanded" class="pl-11 space-y-1 overflow-hidden transition-all duration-300">
        <a *ngFor="let item of frontendMenus" [routerLink]="['/catalog']" [queryParams]="{genre: item.name}"
          class="block p-2 text-sm text-gray-400 hover:text-white hover:translate-x-1 transition-all">
          <span class="mr-2">{{ item.icon }}</span> {{ item.name }}
        </a>
      </div>
    </div>

    <!-- Other Dynamic Categories (if any) -->
    <ng-container *ngIf="genres.length > 0">
      <div *ngFor="let genre of genres">
        <a *ngIf="genre !== 'Spring Boot' && genre !== 'Laravel' && genre !== 'Python' && genre !== 'Angular' && genre !== 'React' && genre !== 'Vue'"
          [routerLink]="['/catalog']" [queryParams]="{genre: genre}" routerLinkActive="bg-white/10 text-white"
          class="flex items-center gap-3 p-3 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition-colors group">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z">
            </path>
          </svg>
          <span class="font-medium">{{ genre }}</span>
        </a>
      </div>
    </ng-container>

    <div class="pt-4 pb-2">
      <span class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Account</span>
    </div>

    <a routerLink="/history" routerLinkActive="bg-white/10 text-white"
      class="flex items-center gap-3 p-3 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition-colors group">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      <span class="font-medium">My History</span>
    </a>
  </nav>

  <div class="p-4 border-t border-white/10">
    <button (click)="onLogout()"
      class="w-full flex items-center gap-3 p-3 rounded-lg text-gray-400 hover:text-red-400 hover:bg-red-400/10 transition-colors group">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
      </svg>
      <span class="font-medium">Logout</span>
    </button>
  </div>
</div>
