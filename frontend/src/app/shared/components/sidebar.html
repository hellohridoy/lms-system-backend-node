<div class="w-64 bg-app-dark text-white flex flex-col h-full shadow-xl transition-all duration-300">
  <div class="p-6 flex items-center gap-3">
    <div class="w-10 h-10 bg-app-primary rounded-lg flex items-center justify-center shadow-lg shadow-indigo-500/30">
      <span class="font-bold text-xl">L</span>
    </div>
    <span class="text-xl font-bold tracking-tight">LibraryMS</span>
  </div>

  <nav class="flex-1 mt-6 px-4 space-y-1">
    <ng-container *ngFor="let item of menuItems">
      <div *ngIf="hasRole(item.roles)">
        <!-- Single Link Item -->
        <a *ngIf="!item.children" [routerLink]="item.route" [queryParams]="item.queryParams"
          [routerLinkActive]="'bg-white/10 text-white'"
          class="flex items-center gap-3 p-3 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition-colors group">
          <svg *ngIf="item.svgPath" class="w-5 h-5 transition-colors group-hover:text-app-primary" fill="none"
            stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.svgPath">
            </path>
          </svg>
          <span class="font-medium">{{ item.name }}</span>
        </a>

        <!-- Dropdown Item -->
        <div *ngIf="item.children" class="space-y-1">
          <button (click)="toggleSubmenu(item)"
            class="w-full flex items-center justify-between p-3 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition-colors group">
            <div class="flex items-center gap-3">
              <svg *ngIf="item.svgPath" class="w-5 h-5 transition-colors group-hover:text-app-primary" fill="none"
                stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.svgPath"></path>
              </svg>
              <span class="font-medium">{{ item.name }}</span>
            </div>
            <svg class="w-4 h-4 transition-transform duration-200" [class.rotate-180]="item.expanded" fill="none"
              stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7">
              </path>
            </svg>
          </button>

          <div *ngIf="item.expanded" class="pl-11 space-y-1 overflow-hidden transition-all duration-300">
            <a *ngFor="let child of item.children" [routerLink]="child.route" [queryParams]="child.queryParams"
              class="block p-2 text-sm text-gray-400 hover:text-white hover:translate-x-1 transition-all flex items-center">
              <svg *ngIf="child.svgPath" class="w-4 h-4 mr-2 transition-colors group-hover:text-app-primary" fill="none"
                stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="child.svgPath"></path>
              </svg>
              {{ child.name }}
            </a>
          </div>
        </div>
      </div>
    </ng-container>

    <div class="pt-4 pb-2 px-3" *ngIf="userRole === 'ROLE_LIBRARIAN'">
      <div class="flex items-center justify-between">
        <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Mode</span>
        <button (click)="toggleManagementMode()"
          class="text-[10px] px-2 py-1 rounded bg-indigo-500/20 text-indigo-400 hover:bg-indigo-500/30 transition-colors"
          [title]="isManagementMode ? 'Switch to Borrower Mode' : 'Switch to Staff Mode'">
          {{ isManagementMode ? 'Staff' : 'Borrower' }}
        </button>
      </div>
    </div>

    <div class="pt-4 pb-2">
      <span class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Account</span>
    </div>

    <a routerLink="/history" routerLinkActive="bg-white/10 text-white"
      class="flex items-center gap-3 p-3 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition-colors group">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      <span class="font-medium">My History</span>
    </a>
  </nav>

  <div class="p-4 border-t border-white/10">
    <button (click)="onLogout()"
      class="w-full flex items-center gap-3 p-3 rounded-lg text-gray-400 hover:text-red-400 hover:bg-red-400/10 transition-colors group">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
      </svg>
      <span class="font-medium">Logout</span>
    </button>
  </div>
</div>
