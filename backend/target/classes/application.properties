spring.application.name=library-management

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/book
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration (Fixed placeholders)
app.jwt.secret=SecretKeyToGenJWTTokenForLibraryManagementSystemWhichIsVeryLongAndSecure1234567890
app.jwt.expiration-ms=86400000
server.port=8080
